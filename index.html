<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Deadlines</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#9aa1b2;--bd:#2a2e3a;--ac:#818cf8}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}header h2{margin:0;flex:1;font-size:20px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.del{color:#dc2626}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{text-align:center;color:var(--mu);font-size:12px;padding:4px}
.day{min-height:92px;border:1px solid var(--bd);border-radius:10px;padding:4px;cursor:pointer;overflow:hidden}
.day:hover{border-color:var(--ac)}.day.out{opacity:.4}.day.today{border:2px solid var(--ac)}
.day b{font-size:12px;color:var(--mu);font-weight:600}.today b{color:var(--ac)}
.chip{display:block;margin-top:3px;padding:2px 6px;border-radius:6px;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mu);margin-top:2px}
aside h3{margin:0 0 8px;font-size:15px}.up{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.dot{width:6px;border-radius:3px;flex:none}.up small{color:var(--mu);display:block}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(360px,92vw);padding:18px}
dialog::backdrop{background:#0008}label{display:block;font-size:12px;color:var(--mu);margin-top:10px}
input{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:16px}.row .sp{flex:1}
#note{font-size:12px;color:var(--mu);margin:8px 2px}
</style></head><body>
<div class="wrap"><main class="card">
<header><h2 id="title"></h2><button id="prev">‹</button><button id="today">Today</button><button id="next">›</button>
<button class="pri" id="add">+ Add</button></header>
<div class="dow"></div><div class="grid" id="grid"></div><div id="note"></div></main>
<aside class="card"><h3>Coming up</h3><div id="up"></div></aside></div>
<dialog id="dlg"><h3 id="dh" style="margin:0 0 4px"></h3>
<label>What is due<input id="f-title" maxlength="80"></label>
<label>Course<input id="f-course" list="courses" maxlength="40"></label><datalist id="courses"></datalist>
<label>Date<input id="f-date" type="date"></label>
<label>Time (optional)<input id="f-time" type="time"></label>
<div class="row"><button class="del" id="b-del">Delete</button><span class="sp"></span><button id="b-cancel">Cancel</button><button class="pri" id="b-save">Save</button></div></dialog>
<script>
// Fill these in after creating your Supabase project (see README). Leave empty for demo mode.
const CFG={url:"https://pmmnbmgbjwdstdtntfrq.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtbW5ibWdiandkc3RkdG50ZnJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMjAxMDYsImV4cCI6MjEwNzc5NjEwNn0.3s2jMcxir2tAlboPNhKuXXfgFq7JgW2f1blzM0OdZ5A"};
const demo=!CFG.url,$=s=>document.querySelector(s);
let items=[],cur=new Date(),editId=null;cur.setDate(1);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const H={apikey:CFG.key,Authorization:"Bearer "+CFG.key,"Content-Type":"application/json"};
const api=async(m,q="",b)=>{const r=await fetch(CFG.url+"/rest/v1/deadlines"+q,{method:m,headers:H,body:b&&JSON.stringify(b)});
 if(!r.ok)throw new Error(await r.text());return m==="GET"?r.json():null};
const ls={get(){try{return JSON.parse(localStorage.getItem("dl")||"null")}catch(e){return null}},set(v){try{localStorage.setItem("dl",JSON.stringify(v))}catch(e){}}};
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
async function load(){try{
 if(demo){items=ls.get()||[{id:1,date:off(1),time:"14:00",course:"Finance",title:"Quiz 2"},{id:2,date:off(3),time:"",course:"Marketing",title:"Report due"},{id:3,date:off(5),time:"23:59",course:"Strategy",title:"Group slides"}]}
 else items=await api("GET","?select=*&order=date,time");
 $("#note").textContent=demo?"Demo mode: data is only saved in this browser.":"";
 }catch(e){$("#note").textContent="Could not load deadlines. Check your connection."}render()}
async function save(o){if(demo){if(o.id)items=items.map(i=>i.id===o.id?o:i);else{o.id=Date.now();items.push(o)}ls.set(items)}
 else{const{id,...b}=o;id?await api("PATCH","?id=eq."+id,b):await api("POST","",b);await load()}render()}
async function del(id){if(demo){items=items.filter(i=>i.id!==id);ls.set(items)}else{await api("DELETE","?id=eq."+id);await load()}render()}
const col=c=>{let h=0;for(const ch of c||"?")h=(h*31+ch.charCodeAt(0))%360;return`hsl(${h} 55% 45%)`};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const lbl=i=>(i.time?i.time.slice(0,5)+" ":"")+(i.course?i.course+": ":"")+i.title;
function render(){
 $("#title").textContent=cur.toLocaleDateString("en",{month:"long",year:"numeric"});
 const g=$("#grid");g.replaceChildren();const start=new Date(cur);start.setDate(1-((cur.getDay()+6)%7));
 for(let k=0;k<42;k++){const d=new Date(start);d.setDate(start.getDate()+k);const s=iso(d);
  const c=el("div","day"+(d.getMonth()!==cur.getMonth()?" out":"")+(s===iso(new Date())?" today":""));
  c.append(el("b","",d.getDate()));const list=items.filter(i=>i.date===s);
  list.slice(0,3).forEach(i=>{const ch=el("span","chip",lbl(i));ch.style.background=col(i.course);ch.onclick=e=>{e.stopPropagation();open(i)};c.append(ch)});
  if(list.length>3)c.append(el("div","more","+"+(list.length-3)+" more"));
  c.onclick=()=>open({date:s});g.append(c)}
 const u=$("#up");u.replaceChildren();const t0=iso(new Date()),t1=off(14);
 const soon=items.filter(i=>i.date>=t0&&i.date<=t1);if(!soon.length)u.append(el("small","","Nothing in the next 2 weeks"));
 soon.forEach(i=>{const r=el("div","up"),dt=el("span","dot");dt.style.background=col(i.course);
  const n=Math.round((new Date(i.date)-new Date(t0))/864e5),w=n===0?"Today":n===1?"Tomorrow":"in "+n+" days";
  const b=el("div");b.append(el("div","",i.title),el("small","",(i.course?i.course+" · ":"")+w+(i.time?" · "+i.time.slice(0,5):"")));
  r.append(dt,b);r.onclick=()=>open(i);u.append(r)})}
function open(i){editId=i.id||null;$("#dh").textContent=editId?"Edit deadline":"New deadline";
 $("#f-title").value=i.title||"";$("#f-course").value=i.course||"";$("#f-date").value=i.date||iso(new Date());$("#f-time").value=(i.time||"").slice(0,5);
 $("#b-del").style.display=editId?"":"none";
 $("#courses").replaceChildren(...[...new Set(items.map(x=>x.course).filter(Boolean))].map(c=>{const o=el("option");o.value=c;return o}));
 $("#dlg").showModal()}
$("#b-save").onclick=async()=>{const t=$("#f-title").value.trim(),d=$("#f-date").value;if(!t||!d){$("#f-title").focus();return}
 const o={date:d,time:$("#f-time").value||null,course:$("#f-course").value.trim(),title:t};if(editId)o.id=editId;
 try{await save(o);$("#dlg").close()}catch(e){alert("Could not save. Try again.")}};
$("#b-del").onclick=async()=>{if(confirm("Delete this deadline?")){try{await del(editId);$("#dlg").close()}catch(e){alert("Could not delete.")}}};
$("#b-cancel").onclick=()=>$("#dlg").close();$("#add").onclick=()=>open({});
$("#prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};$("#next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$("#today").onclick=()=>{cur=new Date();cur.setDate(1);render()};
["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>$(".dow").append(el("div","",d)));
load();if(!demo)setInterval(load,30000);
</script></body></html>
